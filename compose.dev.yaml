name: yt-dlp-downloader-dev

# Ambiente exclusivamente local. PostgreSQL e Redis não compartilham portas ou
# volumes com produção. As credenciais e a configuração de conexão são lidas
# de api/.env pelo Makefile, para não haver divergência entre API, worker e
# serviços do Compose. O armazenamento de arquivos continua no Cloudflare R2
# já configurado em api/.env.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME em api/.env}
      POSTGRES_USER: ${DB_USER:?Defina DB_USER em api/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD em api/.env}
    ports:
      - "${DEV_POSTGRES_PORT:-5433}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:?Defina DB_USER em api/.env} -d ${DB_NAME:?Defina DB_NAME em api/.env}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?Defina REDIS_PASSWORD em api/.env}",
      ]
    ports:
      - "${DEV_REDIS_PORT:-6380}:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:?Defina REDIS_PASSWORD em api/.env}",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api/sql/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=${DB_SOURCE:?Defina DB_SOURCE em api/.env}
      - -verbose
      - up

  server:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    command: go run ./cmd/server/main.go
    env_file:
      - ./api/.env
    environment:
      ENV: development
      GIN_MODE: debug
      SERVER_ADDRESS: 0.0.0.0:8080
      TURNSTILE_SECRET: 1x0000000000000000000000000000000AA
    ports:
      - "${DEV_API_PORT:-8081}:8080"
    volumes:
      - ./api:/workspace
      - dev_go_module_cache:/go/pkg/mod
      - dev_go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Serviço de navegador remoto. Não publica portas: só a API e o worker o
  # alcançam, pela rede interna do Compose, com o segredo compartilhado.
  browser:
    build:
      context: ./api
      dockerfile: Dockerfile.browser
    env_file:
      - ./api/.env
    environment:
      ENV: development
      BROWSER_LISTEN_ADDRESS: 0.0.0.0:9223
      BROWSER_PROFILES_DIR: /data/profiles
      BROWSER_SCREEN_SIZE: 1440x900
      BROWSER_IDLE_TIMEOUT: 15m
      BROWSER_MAX_SESSIONS: 2
    volumes:
      - dev_browser_profiles:/data/profiles
    # O sandbox do Chrome precisa criar user namespaces, o que o seccomp padrão
    # do Docker bloqueia. Este perfil mantém todo o bloqueio padrão e libera
    # apenas clone/unshare, permitindo manter o sandbox ligado.
    security_opt:
      - seccomp=./api/docker/chrome-seccomp.json
    # O Chrome usa /dev/shm intensamente; o padrão de 64M causa aborts.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9223/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    command: go run ./cmd/worker/main.go
    env_file:
      - ./api/.env
    environment:
      ENV: development
    volumes:
      - ./api:/workspace
      - dev_api_uploads:/workspace/uploads
      - dev_go_module_cache:/go/pkg/mod
      - dev_go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      browser:
        condition: service_healthy

  app:
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    # node_modules vive em um volume nomeado, então o `npm install` feito na
    # máquina host não chega aqui. Reinstalar quando o lock for mais novo que a
    # última instalação evita o "Failed to resolve import" de dependência nova.
    command: >-
      sh -ec 'if [ ! -x node_modules/.bin/vite ] ||
      [ package-lock.json -nt node_modules/.package-lock.json ]; then npm ci; fi;
      exec npm run dev -- --host 0.0.0.0'
    environment:
      # Aponta para a API local subida por este mesmo Compose. Para desenvolver
      # o front contra outra API (a de produção, por exemplo), exporte
      # DEV_API_URL antes do `make dev`. Se você mudar DEV_API_PORT, ajuste
      # DEV_API_URL junto.
      VITE_API_URL: ${DEV_API_URL:-http://localhost:8081}
      VITE_SITE_KEY: 1x00000000000000000000AA
    ports:
      - "${DEV_APP_PORT:-5173}:5173"
    volumes:
      - ./app:/workspace
      - dev_app_node_modules:/workspace/node_modules
      - dev_npm_cache:/root/.npm
    depends_on:
      server:
        condition: service_started

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_go_module_cache:
  dev_go_build_cache:
  dev_api_uploads:
  dev_app_node_modules:
  dev_npm_cache:
  # Perfis persistentes do Chrome: sobrevivem a `make dev-down` e ao restart do
  # container, exatamente como em produção.
  dev_browser_profiles:
